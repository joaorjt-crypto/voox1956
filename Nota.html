.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 20px 22px;box-shadow:0 10px 30px rgba(90,60,30,.08)}
h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:30px;line-height:1.1;margin:0 0 8px;text-align:center}
p{margin:0;text-align:center;color:var(--muted);font-size:15px;line-height:1.45}
.sub{margin-bottom:22px}
.escala{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;margin:0 0 6px}
.escala button{aspect-ratio:1/1.15;border:1px solid var(--line);background:#fff;border-radius:10px;font:600 16px Jost,sans-serif;color:var(--text);cursor:pointer;padding:0;transition:transform .1s,background .15s}
.escala button:active{transform:scale(.94)}
.escala button.on{color:#fff;border-color:transparent}
.legenda{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:18px}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:400 15px Jost,sans-serif;color:var(--text);background:#fff;resize:vertical;display:none}
textarea:focus{outline:none;border-color:var(--gold)}
.btn{display:block;width:100%;margin-top:14px;border:none;border-radius:999px;padding:15px;font:600 16px Jost,sans-serif;background:var(--gold);color:#fff;cursor:pointer;text-decoration:none;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:none;color:var(--gold-d);border:1px solid var(--gold)}
.msg{display:none}
.big{font-size:44px;text-align:center;margin:4px 0 10px}
.rod{margin-top:auto;padding-top:26px;text-align:center;font-size:12px;color:var(--muted)}
@media(max-width:380px){.escala{gap:3px}.escala button{font-size:14px;border-radius:8px}}
</style>

<body>
<div class="wrap">
  <div class="logo" role="img" aria-label="Voox 1956"></div>
  <div class="card" id="carregando"><p>Carregando…</p></div>

  <div class="card msg" id="pergunta">
    <h1 id="titulo">Como foi seu atendimento?</h1>
    <p class="sub" id="sub"></p>
    <div class="escala" id="escala"></div>
    <div class="legenda"><span>0 · nada provável</span><span>10 · com certeza</span></div>
    <textarea id="coment" maxlength="600"></textarea>
    <button class="btn" id="enviar" disabled onclick="enviar()">Enviar</button>
  </div>

  <div class="card msg" id="obrigado">
    <div class="big">♡</div>
    <h1>Obrigada!</h1>
    <p id="obrigTxt">Sua resposta ajuda a gente a cuidar cada vez melhor de você.</p>
    <a class="btn" id="google" href="#" target="_blank" rel="noopener" style="display:none">Avaliar a Voox no Google</a>
  </div>

  <div class="card msg" id="erro"><h1>Ops</h1><p id="erroTxt">Este link não é válido.</p></div>
  <div class="rod">Voox 1956 · Estética</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyCXq8_1adhUWx7Au1IDszbpu5bZ5d0A8gk",
  authDomain: "voox-1956.firebaseapp.com",
  projectId: "voox-1956",
  storageBucket: "voox-1956.firebasestorage.app",
  appId: "1:199589852171:web:c9196e78067bb7864fc30e"
};
var tk=(new URLSearchParams(location.search).get('t')||'').replace(/[^a-f0-9]/gi,''), nota=null, ref=null, ficha=null;
function mostrar(id){ ['carregando','pergunta','obrigado','erro'].forEach(function(x){ document.getElementById(x).style.display = x===id ? 'block' : 'none'; }); }
function falha(t){ document.getElementById('erroTxt').textContent=t; mostrar('erro'); }
function cor(n){ return n>=9?'#2E7D55':n>=7?'#C08A2E':'#C0443E'; }
function nomeProf(p){ return String(p||'').replace(/\s*\(.*\)\s*$/,'').toLowerCase().replace(/(^|\s)(\S)/g,function(m,a,b){ return a+b.toUpperCase(); }); }
function obrigado(n, g){
  if(n>=9 && g){ var a=document.getElementById('google'); a.href=g; a.style.display='block'; document.getElementById('obrigTxt').textContent='Que bom que você gostou! Se puder, conta isso no Google também — leva um minutinho e ajuda muito a Voox.'; }
  mostrar('obrigado');
}
function escolher(n){
  nota=n;
  Array.prototype.forEach.call(document.querySelectorAll('.escala button'), function(b){ var on=+b.dataset.n===n; b.classList.toggle('on', on); b.style.background = on ? cor(n) : ''; });
  var t=document.getElementById('coment'); t.style.display='block';
  t.placeholder = n>=9 ? 'Quer contar o que você mais gostou? (opcional)' : n>=7 ? 'O que faltou para ser nota 10? (opcional)' : 'Sentimos muito. Conta pra gente o que aconteceu? (opcional)';
  document.getElementById('enviar').disabled=false;
}
function enviar(){
  if(nota==null) return;
  var b=document.getElementById('enviar'); b.disabled=true; b.textContent='Enviando…';
  var c=document.getElementById('coment').value.trim().slice(0,600), upd={nota:nota, respondidoEm:firebase.firestore.FieldValue.serverTimestamp()};
  if(c) upd.comentario=c;
  ref.update(upd).then(function(){ obrigado(nota, ficha.g); })
    .catch(function(e){ b.disabled=false; b.textContent='Enviar'; alert('Não conseguimos enviar agora. Tente de novo em instantes. ('+(e.code||e.message)+')'); });
}
(function(){
  var esc=document.getElementById('escala');
  for(var i=0;i<=10;i++){ var b=document.createElement('button'); b.type='button'; b.textContent=i; b.dataset.n=i; b.onclick=(function(n){ return function(){ escolher(n); }; })(i); esc.appendChild(b); }
  if(!tk || tk.length<16){ falha('Este link não é válido. Confira se ele veio completo na mensagem.'); return; }
  try{ firebase.initializeApp(firebaseConfig); }catch(e){ falha('Não foi possível carregar a página.'); return; }
  ref=firebase.firestore().collection('voox_notas').doc(tk);
  ref.get().then(function(s){
    if(!s.exists){ falha('Este link não é válido ou expirou.'); return; }
    ficha=s.data();
    if(ficha.nota!=null){ obrigado(ficha.nota, ficha.g); document.getElementById('obrigTxt').textContent='Você já respondeu — obrigada pelo carinho!'; return; }
    var nm=ficha.n?ficha.n+', c':'C', profs=(ficha.p||[]).map(nomeProf).filter(Boolean);
    document.getElementById('titulo').textContent=nm+'omo foi seu atendimento?';
    document.getElementById('sub').textContent='De 0 a 10, o quanto você indicaria a Voox 1956 para uma amiga'+(profs.length?' depois do atendimento com '+profs.join(' e '):'')+'?';
    mostrar('pergunta');
  }).catch(function(e){ falha('Não foi possível abrir agora. Tente de novo em instantes.'); });
})();
</script>
</body>
</html>
