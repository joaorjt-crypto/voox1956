name: Robô Zelo rápido (a cada 15 min)

on:
  schedule:
    # a cada 15 min, das 8h às 20h45 de Brasília (UTC-3), segunda a sábado
    - cron: "4,19,34,49 11-23 * * 1-6"
  workflow_dispatch:

concurrency:
  group: zelo-rapido
  cancel-in-progress: true

jobs:
  rapido:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Atualizar o que muda durante o dia
        env:
          ZELO_USER: ${{ secrets.ZELO_USER }}
          ZELO_PASS: ${{ secrets.ZELO_PASS }}
          FIREBASE_SA_VOOX: ${{ secrets.FIREBASE_SA_VOOX }}
        run: python zelo_sync.py --rapido
